services:
  - type: web
    name: lsj-self-intro
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 app:app
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: GUESTBOOK_DB_PATH
        value: /tmp/guestbook.db
